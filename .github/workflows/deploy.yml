name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medicvn-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: [self-hosted, Linux, X64]
    environment: production
    steps:
      - name: Pull, migrate and restart services
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/root/Healthcare-forum' }}
        run: |
          test -d "$DEPLOY_PATH/.git"
          test -f "$DEPLOY_PATH/.env"
          cd "$DEPLOY_PATH"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans

      - name: Smoke test portal container
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/root/Healthcare-forum' }}
        run: |
          cd "$DEPLOY_PATH"
          if ! curl --fail --show-error --retry 8 --retry-delay 5 --retry-connrefused http://127.0.0.1:3000/ --output /dev/null; then
            details="$(docker compose -f docker-compose.yml -f docker-compose.prod.yml ps frontend 2>&1 | tr '\n' ' ')"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=Portal container unavailable::$details"
            exit 1
          fi

      - name: Smoke test forum container
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/root/Healthcare-forum' }}
        run: |
          cd "$DEPLOY_PATH"
          if ! curl --fail --show-error --retry 8 --retry-delay 5 --retry-connrefused http://127.0.0.1:4000/ --output /dev/null; then
            details="$(docker compose -f docker-compose.yml -f docker-compose.prod.yml ps frontend-forum 2>&1; docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --no-color --tail=20 frontend-forum 2>&1)"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=Forum container unavailable::$details"
            exit 1
          fi

      - name: Smoke test public domains
        run: |
          curl --fail --show-error --retry 8 --retry-delay 5 https://medicvn.com/api/v1/health
          curl --fail --show-error --retry 8 --retry-delay 5 https://forums.medicvn.com/api/v1/health
