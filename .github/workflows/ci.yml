name: CI

on:
  push:
    branches: [main, 'dev/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  frontend:
    name: Frontend checks and dual build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Build portal
        run: npm run build
        env:
          VITE_APP: portal
          VITE_PORTAL_URL: https://medicvn.com
          VITE_FORUM_URL: https://forums.medicvn.com
          VITE_APP_VERSION: ${{ github.sha }}
      - name: Build forum
        run: npm run build
        env:
          VITE_APP: forum
          VITE_PORTAL_URL: https://medicvn.com
          VITE_FORUM_URL: https://forums.medicvn.com
          VITE_APP_VERSION: ${{ github.sha }}

  compose:
    name: Production compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
