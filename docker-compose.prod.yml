services:
  backend:
    build:
      context: ./backend
      target: prod
    volumes:
      - ./backend/uploads:/app/uploads
    command: node dist/server.js
    environment:
      NODE_ENV: production
    restart: always

  frontend:
    build:
      context: ./frontend
      target: prod
    volumes: []
    restart: always

  adminer:
    profiles:
      - disable
