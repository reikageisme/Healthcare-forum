services:
  backend:
    build:
      context: ./backend
      target: prod
    volumes:
      - ./backend/uploads:/app/uploads
    command: node dist/server.js
    environment:
      NODE_ENV: production
    restart: always

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_APP: portal
        VITE_PORTAL_URL: ${VITE_PORTAL_URL:-}
        VITE_FORUM_URL: ${VITE_FORUM_URL:-}
        NGINX_CONF: nginx.conf
    volumes: []
    restart: always

  frontend-forum:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_APP: forum
        VITE_PORTAL_URL: ${VITE_PORTAL_URL:-}
        VITE_FORUM_URL: ${VITE_FORUM_URL:-}
        NGINX_CONF: nginx.forum.conf
    volumes: []
    command: ["nginx", "-g", "daemon off;"]
    restart: always

  adminer:
    profiles:
      - disable
