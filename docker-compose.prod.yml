services:
  backend:
    build:
      context: ./backend
      target: prod
    volumes:
      - ./backend/uploads:/app/uploads
    command: node dist/server.js
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required for production}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required for production}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?BACKEND_CORS_ORIGINS is required for production}
    restart: always

  frontend:
    build:
      context: ./frontend
      target: prod
    volumes: []
    restart: always

  adminer:
    profiles:
      - disable
