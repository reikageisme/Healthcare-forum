server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Vite nhét hash nội dung vào tên file trong /assets/ — đổi nội dung là đổi
    # URL — nên cache vĩnh viễn ở đây vừa an toàn vừa đáng.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Mọi ảnh còn lại đến từ public/ và mang TÊN CỐ ĐỊNH: favicon.svg,
    # logo-wide.png, og-image.jpg... Cache một năm cho nhóm này là cách chắc
    # chắn nhất để một logo mới không bao giờ tới được ai — đúng chuyện đã xảy
    # ra với favicon. Một giờ, kèm bắt kiểm lại, là đủ nhẹ tải mà vẫn đổi được.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # Crawler files come from the backend, which knows the real post list.
    location = /sitemap.xml {
        proxy_pass http://backend:8000/sitemap.xml;
        proxy_set_header Host $host;
    }

    location = /robots.txt {
        proxy_pass http://backend:8000/robots.txt;
        proxy_set_header Host $host;
    }

    # Diễn đàn đã tách sang tên miền con.
    #
    # 301 chứ không 302: 302 nói với Google rằng chỗ này chỉ tạm thời, thứ
    # hạng sẽ ở lại đây trong khi nội dung đã đi mất. Giữ nguyên phần đuôi
    # đường dẫn nên /forum/tim-mach vẫn tới đúng box, và mọi link đã chia sẻ
    # trước đây không gãy.
    #
    # Trang chủ diễn đàn nằm ở gốc tên miền con, box nằm ở /c/<slug> — nên
    # phần đuôi phải được ánh xạ chứ không bê nguyên.
    #
    # Đây là chỗ duy nhất ghi tên miền diễn đàn ở phía trang tin — đổi tên
    # miền thì sửa hai dòng dưới.
    location = /forum {
        return 301 https://forums.medicvn.com/;
    }
    location ^~ /forum/ {
        rewrite ^/forum/(.*)$ https://forums.medicvn.com/c/$1 permanent;
    }

    # SPA fallback.
    #
    # index.html KHÔNG được cache. Nó là thứ trỏ tới bundle JS có hash trong
    # tên; giữ một bản index.html cũ nghĩa là người dùng chạy mãi bản ứng dụng
    # cũ dù đã deploy — deploy xong tính năng mới không hiện, mà không ai biết
    # tại sao. Bundle thì cache một năm thoải mái vì đổi nội dung là đổi tên.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Uploaded images served by the backend
    location ^~ /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
    }

    # API Proxy
    location /api/ {
        # nginx defaults to 1 MB, which rejected every image above that size
        # with a 413 before the request ever reached the backend — while the
        # backend's own limit is 5 MB. Kept a little above it so the API is
        # the thing that reports an oversized file, with its own message.
        client_max_body_size 6m;
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
