<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Medic Việt Nam — Diễn đàn Y tế và Sức khỏe</title>
    <meta
      name="description"
      content="Diễn đàn y tế Việt Nam: đặt câu hỏi cho bác sĩ đã xác thực, đọc kinh nghiệm khám chữa bệnh và chia sẻ kiến thức sức khỏe cho cộng đồng."
    />
    <meta name="theme-color" content="#2D6DD1" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Ảnh và tiêu đề khi dán link vào Facebook, Zalo, Messenger. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Medic Việt Nam" />
    <meta property="og:title" content="Medic Việt Nam — Diễn đàn Y tế và Sức khỏe" />
    <meta
      property="og:description"
      content="Đặt câu hỏi cho bác sĩ đã xác thực, đọc kinh nghiệm khám chữa bệnh và chia sẻ kiến thức sức khỏe cho cộng đồng."
    />
    <meta property="og:image" content="/logo-mark-512.png" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      /*
       * Màn hình chờ.
       *
       * Trước đây <div id="root"> rỗng: từ lúc bấm vào link tới lúc React
       * dựng xong giao diện, người dùng nhìn một trang trắng trơn — trên mạng
       * chậm là vài giây, đủ để họ tưởng web hỏng và thoát ra. Khối này nằm
       * ngay trong HTML nên hiện tức thì, và tự biến mất khi React thay nội
       * dung của #root.
       *
       * Để trong index.html chứ không phải một component React: nếu là
       * component thì nó cũng phải chờ chính bundle JS tải xong mới hiện,
       * tức là không giải quyết đúng khoảng thời gian đang bị trắng.
       */
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #f8fafc;
        z-index: 9999;
      }
      #app-splash img {
        width: 220px;
        max-width: 60vw;
        height: auto;
      }
      #app-splash .bar {
        width: 180px;
        max-width: 50vw;
        height: 3px;
        border-radius: 9999px;
        background: #e2e8f0;
        overflow: hidden;
      }
      #app-splash .bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 9999px;
        background: #2d6dd1;
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes splash-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      /* Người bật "giảm chuyển động" nhận một thanh tĩnh thay vì vạch chạy. */
      @media (prefers-reduced-motion: reduce) {
        #app-splash .bar i { animation: none; width: 100%; opacity: 0.5; }
      }
      /* React dựng xong là #root có con — ẩn màn chờ, không cần JS gỡ. */
      #root:not(:empty) + #app-splash { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="app-splash">
      <img src="/logo-wide.png" alt="Medic Việt Nam" width="648" height="132" />
      <div class="bar" role="progressbar" aria-label="Đang tải trang"><i></i></div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
