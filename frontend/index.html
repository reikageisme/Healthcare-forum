<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Medic Việt Nam — Diễn đàn Y tế và Sức khỏe</title>
    <meta
      name="description"
      content="Diễn đàn y tế Việt Nam: đặt câu hỏi cho bác sĩ đã xác thực, đọc kinh nghiệm khám chữa bệnh và chia sẻ kiến thức sức khỏe cho cộng đồng."
    />
    <meta name="theme-color" content="#2D6DD1" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Ảnh và tiêu đề khi dán link vào Facebook, Zalo, Messenger. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Medic Việt Nam" />
    <meta property="og:title" content="Medic Việt Nam — Diễn đàn Y tế và Sức khỏe" />
    <meta
      property="og:description"
      content="Đặt câu hỏi cho bác sĩ đã xác thực, đọc kinh nghiệm khám chữa bệnh và chia sẻ kiến thức sức khỏe cho cộng đồng."
    />
    <!-- 1200x630 là khổ Facebook/Zalo dựng thẻ xem trước; nền đặc chứ không
         trong suốt, vì nhiều nơi ghép ảnh trong suốt lên nền đen. -->
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Medic Việt Nam — Kết nối tri thức y khoa, chia sẻ vì sức khỏe cộng đồng" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      /*
       * Màn hình chờ.
       *
       * Trước đây <div id="root"> rỗng: từ lúc bấm vào link tới lúc React
       * dựng xong giao diện, người dùng nhìn một trang trắng trơn — trên mạng
       * chậm là vài giây, đủ để họ tưởng web hỏng và thoát ra. Khối này nằm
       * ngay trong HTML nên hiện tức thì, và tự biến mất khi React thay nội
       * dung của #root.
       *
       * Để trong index.html chứ không phải một component React: nếu là
       * component thì nó cũng phải chờ chính bundle JS tải xong mới hiện,
       * tức là không giải quyết đúng khoảng thời gian đang bị trắng.
       */
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        z-index: 9999;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      /*
        Bông sen tự vẽ nằm trong chính file SVG (có <style> riêng), nạp bằng
        <img>. Nhúng thẳng vào đây thì index.html phồng thêm ~8KB mà mỗi lượt
        tải đều phải kéo lại, vì index.html cố tình không được cache; để riêng
        một file thì trình duyệt cache nó như mọi ảnh khác.
      */
      #app-splash img {
        width: 132px;
        height: 132px;
      }
      #app-splash .msg {
        margin-top: 18px;
        font-size: 17px;
        font-weight: 700;
        color: #1e293b;
        letter-spacing: -0.01em;
      }
      #app-splash .build {
        margin-top: 8px;
        font-size: 12px;
        color: #94a3b8;
        font-variant-numeric: tabular-nums;
      }
      /* React dựng xong là #root có con — ẩn màn chờ, không cần JS gỡ. */
      #root:not(:empty) + #app-splash { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="app-splash">
      <img src="/splash-lotus.svg" alt="" width="132" height="132" />
      <p class="msg">Đang tải dữ liệu&hellip;</p>
      <p class="build">Bản dựng %BUILD_ID%</p>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
