# Postgres lives outside this stack, on 192.168.1.102. Point DATABASE_URL at
# it in .env. To run a throwaway database alongside instead, add the optional
# override:  docker compose -f docker-compose.yml -f docker-compose.db.yml up
services:
  # Same service name and port as the FastAPI backend it replaced, so the
  # frontend's vite proxy (/api and /uploads -> backend:8000) is unchanged.
  backend:
    build:
      context: ./backend
      target: dev
    container_name: healthcare_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src
      - ./backend/drizzle:/app/drizzle
      - ./backend/uploads:/app/uploads
    command: npm run dev
    restart: unless-stopped
    networks:
      - healthcare-net

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: healthcare_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/vite.config.ts:/app/vite.config.ts
    env_file:
      - .env
    networks:
      - healthcare-net

  adminer:
    image: adminer
    container_name: healthcare_adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: ${POSTGRES_HOST:-192.168.1.102}
    networks:
      - healthcare-net

networks:
  healthcare-net:
    driver: bridge
