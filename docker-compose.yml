# Postgres lives outside this stack, on 192.168.1.102. Point DATABASE_URL at
# it in .env. To run a throwaway database alongside instead, add the optional
# override:  docker compose -f docker-compose.yml -f docker-compose.db.yml up
services:
  # Same service name and port as the FastAPI backend it replaced, so the
  # frontend's vite proxy (/api and /uploads -> backend:8000) is unchanged.
  backend:
    build:
      context: ./backend
      target: dev
    container_name: healthcare_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src
      - ./backend/drizzle:/app/drizzle
      - ./backend/uploads:/app/uploads
    command: npm run dev
    restart: unless-stopped
    networks:
      - healthcare-net

  # Cổng tin tức medicvn.com.
  frontend:
    build:
      context: ./frontend
      target: dev
      args:
        VITE_APP: portal
        VITE_PORTAL_URL: ${VITE_PORTAL_URL:-}
        VITE_FORUM_URL: ${VITE_FORUM_URL:-}
    container_name: healthcare_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/vite.config.ts:/app/vite.config.ts
    env_file:
      - .env
    # `environment` thắng env_file, nên .env đặt VITE_APP thế nào cũng không
    # làm hai container dựng ra cùng một trang.
    environment:
      VITE_APP: portal
    networks:
      - healthcare-net

  # Diễn đàn forums.medicvn.com — cùng mã nguồn, khác bản dựng, cổng 4000.
  # NPM trỏ host forums.medicvn.com về cổng này.
  frontend-forum:
    build:
      context: ./frontend
      target: dev
      args:
        VITE_APP: forum
        VITE_PORTAL_URL: ${VITE_PORTAL_URL:-}
        VITE_FORUM_URL: ${VITE_FORUM_URL:-}
    container_name: healthcare_frontend_forum
    ports:
      - "4000:4000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/vite.config.ts:/app/vite.config.ts
    env_file:
      - .env
    environment:
      VITE_APP: forum
    command: npm run dev -- --host 0.0.0.0 --port 4000
    networks:
      - healthcare-net

  adminer:
    image: adminer
    container_name: healthcare_adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: ${POSTGRES_HOST:-192.168.1.102}
    networks:
      - healthcare-net

networks:
  healthcare-net:
    driver: bridge
